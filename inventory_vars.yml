---
- hosts: all
  connection: local
  tasks:
    - shell: env
      register: var_env

    - debug:
        var: var_env

    - debug:
        msg: |
          "{{ hostvars['localhost'].connection }}"
          "{{ hostvars['localhost'].token_ocp }}"
          "{{ ansible_facts['connection'] }}"
          "{{ ansible_facts['token_ocp'] }}"
