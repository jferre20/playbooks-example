---
- hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - block:
        - shell: |
            echo -n "jabulani" | openssl enc -aes-256-cbc -a -salt -pbkdf2 -pass env:SECRET_KEY
          environment:
            SECRET_KEY: "{{ password_encrypt }}"
          register: encrypt_result

        - name: Set a variable for the workflow
          ansible.builtin.set_stats:
            data:
              bola: "{{ encrypt_result.stdout }}"
      when: node == "first"

    - block:
        - name: Descriptografar o dado recebido do artefato
          ansible.builtin.shell: |
            echo "{{ bola  }}" | openssl enc -aes-256-cbc -a -d -salt -pbkdf2 -pass env:SECRET_KEY
          environment:
            SECRET_KEY: "{{ password_encrypt }}"
          register: decrypt_result

        - name: Use the variable from the previous node
          ansible.builtin.debug:
            msg: "The value is {{ decrypt_result.stdout }}"
      when: node == "second"
